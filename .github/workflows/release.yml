name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to release from
        required: true
        default: main

permissions:
  contents: write

jobs:
  build:
    name: Build and publish release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build project
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu

      - name: Pack release artifacts
        run: |
          tar -czf \
            "./target/${{ github.event.repository.name }}_linux_amd64.tar.gz" \
            -C ./target/x86_64-unknown-linux-gnu/release \
            simple-completion-language-server

      - name: Set tag name
        run: echo "GITHUB_RELEASE_TAG=v$(date -u +'%Y%m%d')" >> "$GITHUB_ENV"

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.GITHUB_RELEASE_TAG }}
          target_commitish: ${{ github.event.inputs.branch || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ./target/${{ github.event.repository.name }}_linux_amd64.tar.gz
